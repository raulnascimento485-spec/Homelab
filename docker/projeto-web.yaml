services:
  nginx:
    image: nginx:alpine
    container_name: meu-nginx
    restart: unless-stopped
    ports:
      - "${SERVER_IP}:8080:80"
    volumes:
      - "${SITE_DIR}:/usr/share/nginx/html:ro"

  db:
    image: postgres:17-alpine
    container_name: meu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laboratorio -d laboratorio"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: meu-adminer
    restart: unless-stopped
    ports:
      - "${SERVER_IP}:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
